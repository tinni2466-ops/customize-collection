<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartContainer = document.getElementById("cartItems");
const emptyCart = document.getElementById("emptyCart");
const RUPEE = "\u20B9";

function saveCart(){
    localStorage.setItem("cart", JSON.stringify(cart));
}

function makeCartId(){
    return "cart_" + Date.now() + "_" + Math.random().toString(36).slice(2);
}

function fixCartIds(){
    let changed = false;

    cart.forEach(item => {
        if(!item.cartId){
            item.cartId = makeCartId();
            changed = true;
        }

        if(!item.qty){
            item.qty = 1;
            changed = true;
        }
    });

    if(changed) saveCart();
}

function getCartIndex(cartId){
    return cart.findIndex(item => item.cartId === cartId);
}

function showAnswers(item){
    let html = "";

    function colorDot(color){
        return `
            <span style="
                width:14px;
                height:14px;
                border-radius:50%;
                display:inline-block;
                border:1px solid #ccc;
                background:${color};
            "></span>
        `;
    }

    if(item.material){
        html += `<p class="text-sm mt-1"><b>Material:</b> ${item.material}</p>`;
    }

    if(item.color){
        html += `
            <p class="text-sm mt-1 flex items-center gap-2">
                <b>Color:</b>
                ${colorDot(item.color)}
            </p>
        `;
    }

    if(item.size){
        html += `<p class="text-sm mt-1"><b>Size:</b> ${item.size}</p>`;
    }

    if(item.notes){
        html += `<p class="text-sm mt-1"><b>Notes:</b> ${item.notes}</p>`;
    }

    for(let i = 1; i <= 4; i++){
        const question = item["question" + i] || "Answer " + i;
        const answer = item["answer" + i];

        if(!answer) continue;

        const lowerQuestion = question.toLowerCase();

        if(
            lowerQuestion === "material" ||
            lowerQuestion === "color" ||
            lowerQuestion === "size" ||
            lowerQuestion === "notes"
        ){
            continue;
        }

        html += `
            <p class="text-sm mt-1">
                <b>${question}:</b> ${answer}
            </p>
        `;
    }

    return html;
}

function goToProductDetailsFromCart(imagePath, displayName) {
    if (!imagePath) {
        window.location.href = "product-details.html";
        return;
    }

    let foundCategory = "Saree"; // Ultimate fallback category if not found

    // 1. Loop through your complete master dataset to discover the item's true Category
    if (typeof subProducts !== "undefined" && subProducts) {
        for (const category in subProducts) {
            if (!subProducts[category]) continue;
            
            // Check if any sub-product item inside this category matches our image path
            const hasMatch = subProducts[category].some(p => p && p.img === imagePath);
            if (hasMatch) {
                foundCategory = category;
                break; // Category found! Stop searching.
            }
        }
    }

    // 2. THE PERMANENT FIX: Extract the filename exactly like the details page does
    // Example: "images/Mekhela-Chador1.png" -> "Mekhela-Chador1"
    const filenameWithExtension = imagePath.replace(/^.*[\\\/]/, "");
    const filename = filenameWithExtension.replace(/\.[^/.]+$/, ""); 

    // 3. Convert it directly into the precise HTML layout anchor ID matching your system
    // Example: "Mekhela-Chador1" -> "mekhela-chador1"
    const standardizedId = filename
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9\-]/g, "");

    // 4. Open the details page precisely targeted to that product item row line
    window.location.href = `product-details.html?category=${encodeURIComponent(foundCategory)}#${standardizedId}`;
}

function renderCart(){
    cartContainer.innerHTML = "";

    if(cart.length === 0){
        emptyCart.classList.remove("hidden");
        updateTotal();
        return;
    }

    emptyCart.classList.add("hidden");

    cart.forEach(item => {
        let div = document.createElement("div");
        div.className = "bg-white p-4 mb-3 shadow flex gap-4";

        if (item.isBlouseCombo) {
            // RENDER BLOUSE COMBO
            const nameFront = item.nameFront || "";
            const imgFront = item.imgFront || "";

            div.innerHTML = `
                <div class="flex items-start gap-3 w-full">
                    <div class="pt-2">
                        <input type="checkbox"
                            class="order-select-checkbox"
                            ${item.selectedForOrder !== false ? "checked" : ""}
                            onchange="toggleOrderSelection('${item.cartId}', this.checked)"
                            style="width:18px;height:18px;cursor:pointer;">
                    </div>

                    <div class="flex gap-2 shrink-0">
                        <div class="relative">
                            <img src="${item.imgFront}" class="w-24 h-24 object-cover rounded border">
                            <span class="absolute bottom-0 left-0 right-0 bg-black/60 text-[10px] text-white text-center py-0.5">Front</span>
                        </div>
                        <div class="relative">
                            <img src="${item.imgBack}" class="w-24 h-24 object-cover rounded border">
                            <span class="absolute bottom-0 left-0 right-0 bg-black/60 text-[10px] text-white text-center py-0.5">Back</span>
                        </div>
                    </div>

                    <div class="flex-1">
                        <h3 class="font-semibold leading-snug">
                            ${item.nameFront}<br>
                            <span class="text-gray-400 font-normal text-xs">&amp;</span> ${item.nameBack}

                        <p class="text-sm text-gray-500">
                            Seller: Customize Collection
                        </p>

                        ${showAnswers(item)}

                        <p class="font-bold mt-2">
                            ${RUPEE}${item.price}
                        </p>

                        <div class="flex items-center gap-2 mt-2">

                            <span>${item.qty}</span>
                            <button onclick="changeQty('${item.cartId}', 1)" class="px-2 border">+</button>
                        </div>

                        <div class="flex gap-4 mt-2 text-blue-500 text-sm">
                            <button onclick="removeItem('${item.cartId}')">REMOVE</button>
                            
                            <button type="button" 
                                    class="view-details-action-btn" 
                                    style="cursor: pointer; font-weight: 500;"
                                    data-img="${encodeURIComponent(imgFront)}" 
                                    data-name="${encodeURIComponent(nameFront)}">
                                VIEW DETAILS
                            </button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // RENDER STANDARD ITEMS
            const targetName = item.displayName || item.name || "";
            const imgPath = item.img || "";

            div.innerHTML = `
                <div class="flex items-start gap-3 w-full">
                    <div class="pt-2">
                        <input type="checkbox"
                            class="order-select-checkbox"
                            ${item.selectedForOrder !== false ? "checked" : ""}
                            onchange="toggleOrderSelection('${item.cartId}', this.checked)"
                            style="width:18px;height:18px;cursor:pointer;">
                    </div>

                    <img src="${item.img}" class="w-24 h-24 object-cover rounded">

                    <div class="flex-1">
                        <h3 class="font-semibold">
                            ${targetName}
                        </h3>

                        <p class="text-sm text-gray-500">
                            Seller: Customize Collection
                        </p>

                        ${showAnswers(item)}

                        <p class="font-bold mt-2">
                            ${RUPEE}${item.price}
                        </p>

                        <div class="flex items-center gap-2 mt-2">
                            <button onclick="changeQty('${item.cartId}', -1)" class="px-2 border">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty('${item.cartId}', 1)" class="px-2 border">+</button>
                        </div>

                        <div class="flex gap-4 mt-2 text-blue-500 text-sm">
                            <button onclick="removeItem('${item.cartId}')">REMOVE</button>
                            
                            <button type="button" 
                                    class="view-details-action-btn" 
                                    style="cursor: pointer; font-weight: 500;"
                                    data-img="${encodeURIComponent(imgPath)}" 
                                    data-name="${encodeURIComponent(targetName)}">
                                VIEW DETAILS
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Attach event listener to view details action button nodes dynamically
        const detailBtn = div.querySelector(".view-details-action-btn");
        if (detailBtn) {
            detailBtn.addEventListener("click", function(e) {
                e.preventDefault();
                const cleanImg = decodeURIComponent(this.getAttribute("data-img"));
                const cleanName = decodeURIComponent(this.getAttribute("data-name"));
                
                // 🟢 CHANGED LINE: Triggers the unified image filename routing system
                goToProductDetailsFromCart(cleanImg, cleanName);
            });
        }

        cartContainer.appendChild(div);
    });

    updateTotal();
}

function updateTotal(){
    let total = 0;
    let count = 0;

    cart.forEach(item => {
        if(item.selectedForOrder !== false){
            total += Number(item.price) * Number(item.qty);
            count += Number(item.qty);
        }
    });

    document.getElementById("totalPrice").innerText = RUPEE + total;
    document.getElementById("finalPrice").innerText = RUPEE + total;
    document.getElementById("itemCount").innerText = count;
    document.getElementById("mobileTotal").innerText = RUPEE + total;
}

function changeQty(cartId, change){
    const index = getCartIndex(cartId);
    if(index === -1) return;

    cart[index].qty += change;

    if(cart[index].qty <= 0){
        cart.splice(index, 1);
    }

    saveCart();
    renderCart();
}

function removeItem(cartId){
    const index = getCartIndex(cartId);
    if(index === -1) return;

    cart.splice(index, 1);
    saveCart();
    renderCart();
}

function toggleOrderSelection(cartId, isChecked){
    const index = getCartIndex(cartId);
    if(index === -1) return;

    cart[index].selectedForOrder = isChecked;
    saveCart();
    updateTotal();
}

function placeSelectedOrder(){
    const selectedProducts = cart.filter(item => item.selectedForOrder !== false);

    if(selectedProducts.length === 0){
        alert("Please select at least one product.");
        return;
    }

    const totalSettlementSum = selectedProducts.reduce((sum, item) => {
        return sum + (Number(item.price) * Number(item.qty));
    }, 0);

    localStorage.setItem("checkoutProducts", JSON.stringify(selectedProducts));
    localStorage.setItem("pendingOrderItems", JSON.stringify(selectedProducts));
    localStorage.setItem("pendingOrderTotal", totalSettlementSum);

    cart = cart.filter(item => item.selectedForOrder === false);
    saveCart();

    window.location.href = "order.html";
}

function goHome(){
    window.location.href = "index.html";
}

function loadSavedDeliveryLocation(){
    const savedPin = localStorage.getItem("activeSessionLocationPin");
    const savedArea = localStorage.getItem("user_selected_area_name");
    const locationBox = document.getElementById("savedLocationBox");

    if(!locationBox) return;

    if(savedPin && savedArea){
        locationBox.innerHTML = `${savedArea} (${savedPin})`;
    } else {
        locationBox.innerHTML = `<span style="color:#ef4444;">No location selected</span>`;
    }
}

fixCartIds();
loadSavedDeliveryLocation();
renderCart();
