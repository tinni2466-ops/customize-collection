<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Care - Customize Collection</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#f1f3f6; }
</style>
</head>

<body class="flex flex-col min-h-screen">

<header class="bg-white shadow-md p-3 flex justify-between items-center w-full">
    <div class="flex items-center gap-2 font-bold text-lg cursor-pointer" onclick="goHome()">
        <img src="images/Logo.png" class="w-8 h-8 rounded-full object-contain" onerror="this.src='Logo.png'; this.onerror=null;">
        Customize Collection
    </div>

    <button onclick="window.location.href='index.html'" 
        class="hover:bg-gray-100 transition-colors duration-200" 
        style="cursor: pointer; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05);" 
        title="Go to Home">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="#000000">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
</button>
</header>

<main class="flex-1 flex flex-col items-center justify-center px-4 text-center">
    <div class="max-w-md p-8 bg-white rounded shadow-md border border-gray-100">
        <div class="mb-4 text-gray-400 flex justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z" />
            </svg>
        </div>

        <h1 class="text-4xl font-extrabold text-gray-400 tracking-tight uppercase mb-3">
            Coming Soon
        </h1>
        
        <p class="text-sm text-gray-500 mb-6 leading-relaxed">
            Our specialized Customer Care Helpdesk and Live Chat Support system is currently undergoing assembly tuning. We'll be ready to assist you shortly!
        </p>

        <button onclick="goHome()" class="px-6 py-2 bg-blue-500 text-white font-medium rounded transition duration-200 hover:bg-blue-600 shadow-sm">
            Return to Storefront
        </button>
    </div>
</main>

<script>
function goHome(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
